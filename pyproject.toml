[project]
name = "PoseCapture"
description = "Turn video motion into game-ready character sprite sheets, right inside ComfyUI. Video of a person -> cleaned side-view skeleton track (DWPose with feet, planted feet, one ground line) -> fitted to your character -> z-buffered cylinder pose frames for SCAIL-Preview."
version = "1.2.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy", "pillow"]
classifiers = ["Operating System :: OS Independent", "License :: OSI Approved :: GNU General Public License v3 (GPLv3)"]

[project.urls]
Repository = "https://github.com/Eloque/PoseCapture"
"Bug Tracker" = "https://github.com/Eloque/PoseCapture/issues"

[tool.comfy]
PublisherId = "eloque"
DisplayName = "Extract, track and retarget character motion from video"
Icon = ""
includes = []
